<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A55"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C3A3A"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A94"/>
    </marker>
  </defs>

  <rect width="1120" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="46" font-size="23" font-weight="600" fill="#1C1C22">Northstar Support Co. — Agentic Ticket Triage</text>
  <text x="40" y="70" font-size="13.5" fill="#63636E">Multi-agent pipeline with a critic gate. The human checkpoint moves from every reply to flagged replies only.</text>

  <!-- ===== Row 1: the pipeline ===== -->

  <!-- Ticket source -->
  <rect x="40" y="112" width="150" height="86" rx="6" fill="#EDF3EC" stroke="#3D6B45" stroke-width="1.6"/>
  <text x="115" y="140" font-size="13" font-weight="600" fill="#1C3A24" text-anchor="middle">Ticket Source</text>
  <text x="115" y="159" font-size="10.5" fill="#3D6B45" text-anchor="middle">tickets.csv / SQLite</text>
  <text x="115" y="175" font-size="10.5" fill="#3D6B45" text-anchor="middle">TOOL</text>
  <text x="115" y="191" font-size="10" font-style="italic" fill="#7A8A7E" text-anchor="middle">Lance</text>

  <path d="M 190 155 L 240 155" stroke="#4A4A55" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Triage agent -->
  <rect x="248" y="112" width="150" height="86" rx="6" fill="#E8EEF7" stroke="#2C4B7C" stroke-width="1.6"/>
  <text x="323" y="140" font-size="13" font-weight="600" fill="#16294A" text-anchor="middle">Triage Agent</text>
  <text x="323" y="159" font-size="10.5" fill="#2C4B7C" text-anchor="middle">category · priority</text>
  <text x="323" y="175" font-size="10.5" fill="#2C4B7C" text-anchor="middle">confidence score</text>
  <text x="323" y="191" font-size="10" font-style="italic" fill="#78849A" text-anchor="middle">Nataki</text>

  <path d="M 398 155 L 448 155" stroke="#4A4A55" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Policy lookup -->
  <rect x="456" y="112" width="150" height="86" rx="6" fill="#EDF3EC" stroke="#3D6B45" stroke-width="1.6"/>
  <text x="531" y="140" font-size="13" font-weight="600" fill="#1C3A24" text-anchor="middle">Policy Lookup</text>
  <text x="531" y="159" font-size="10.5" fill="#3D6B45" text-anchor="middle">section match on</text>
  <text x="531" y="175" font-size="10.5" fill="#3D6B45" text-anchor="middle">policy_kb.md · TOOL</text>
  <text x="531" y="191" font-size="10" font-style="italic" fill="#7A8A7E" text-anchor="middle">Lance / Mitchy</text>

  <path d="M 606 155 L 656 155" stroke="#4A4A55" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Drafter -->
  <rect x="664" y="112" width="150" height="86" rx="6" fill="#E8EEF7" stroke="#2C4B7C" stroke-width="1.6"/>
  <text x="739" y="140" font-size="13" font-weight="600" fill="#16294A" text-anchor="middle">Drafter Agent</text>
  <text x="739" y="159" font-size="10.5" fill="#2C4B7C" text-anchor="middle">writes the reply</text>
  <text x="739" y="175" font-size="10.5" fill="#2C4B7C" text-anchor="middle">from policy only</text>
  <text x="739" y="191" font-size="10" font-style="italic" fill="#78849A" text-anchor="middle">Mitchy</text>

  <path d="M 814 155 L 864 155" stroke="#4A4A55" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Critic -->
  <rect x="872" y="112" width="150" height="86" rx="6" fill="#E8EEF7" stroke="#2C4B7C" stroke-width="2.4"/>
  <text x="947" y="140" font-size="13" font-weight="600" fill="#16294A" text-anchor="middle">Critic Agent</text>
  <text x="947" y="159" font-size="10.5" fill="#2C4B7C" text-anchor="middle">approved? </text>
  <text x="947" y="175" font-size="10.5" fill="#2C4B7C" text-anchor="middle">needs_human?</text>
  <text x="947" y="191" font-size="10" font-style="italic" fill="#78849A" text-anchor="middle">Julian</text>

  <!-- Retry loop: critic back to drafter -->
  <path d="M 947 198 L 947 236 L 739 236 L 739 198" fill="none" stroke="#8C3A3A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="770" y="224" width="146" height="21" rx="3" fill="#FFFFFF"/>
  <text x="843" y="239" font-size="10.5" font-weight="600" fill="#8C3A3A" text-anchor="middle">rejected → revise (max 2)</text>

  <!-- Orchestrator band -->
  <rect x="40" y="88" width="982" height="176" rx="8" fill="none" stroke="#B0B0BC" stroke-width="1.3" stroke-dasharray="3 4"/>
  <rect x="52" y="80" width="180" height="18" fill="#FFFFFF"/>
  <text x="58" y="94" font-size="11" font-weight="600" fill="#63636E">ORCHESTRATOR — Enrique</text>

  <!-- Critic down to the gate -->
  <path d="M 947 264 L 947 300 L 560 300 L 560 328" fill="none" stroke="#4A4A55" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="760" y="293" font-size="10.5" fill="#63636E" text-anchor="middle">approved draft + verdict</text>

  <!-- ===== The approval gate ===== -->
  <path d="M 560 330 L 700 392 L 560 454 L 420 392 Z" fill="#FBF0D9" stroke="#9A6B1E" stroke-width="2.4"/>
  <text x="560" y="382" font-size="13.5" font-weight="700" fill="#6B4A12" text-anchor="middle">APPROVAL GATE</text>
  <text x="560" y="400" font-size="10.5" fill="#8A6318" text-anchor="middle">approved AND</text>
  <text x="560" y="415" font-size="10.5" fill="#8A6318" text-anchor="middle">not flagged?</text>

  <text x="560" y="480" font-size="10.5" font-style="italic" fill="#8A8A94" text-anchor="middle">Gate policy owned by Enrique · flag rules owned by Julian</text>

  <!-- Yes branch -->
  <path d="M 420 392 L 300 392 L 300 500" fill="none" stroke="#3D6B45" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="358" y="384" font-size="11" font-weight="600" fill="#3D6B45" text-anchor="middle">YES</text>

  <rect x="180" y="504" width="240" height="76" rx="6" fill="#E8F1EA" stroke="#3D6B45" stroke-width="1.6"/>
  <text x="300" y="530" font-size="13" font-weight="600" fill="#1C3A24" text-anchor="middle">Auto-sent to customer</text>
  <text x="300" y="549" font-size="10.5" fill="#3D6B45" text-anchor="middle">no human touches it</text>
  <text x="300" y="566" font-size="10.5" fill="#3D6B45" text-anchor="middle">still fully logged</text>

  <!-- No branch -->
  <path d="M 700 392 L 820 392 L 820 500" fill="none" stroke="#8C3A3A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="762" y="384" font-size="11" font-weight="600" fill="#8C3A3A" text-anchor="middle">NO</text>

  <rect x="700" y="504" width="240" height="76" rx="6" fill="#F7E9E9" stroke="#8C3A3A" stroke-width="2.4"/>
  <text x="820" y="527" font-size="13" font-weight="700" fill="#6B2626" text-anchor="middle">HUMAN REVIEW QUEUE</text>
  <text x="820" y="546" font-size="10.5" fill="#8C3A3A" text-anchor="middle">supervisor approves / edits / rejects</text>
  <text x="820" y="563" font-size="10.5" fill="#8C3A3A" text-anchor="middle">python main.py --review</text>

  <!-- What lands in the queue -->
  <rect x="962" y="504" width="128" height="76" rx="5" fill="#FFFFFF" stroke="#C8C8D0" stroke-width="1.2"/>
  <text x="972" y="522" font-size="9.5" font-weight="600" fill="#63636E">FLAGGED WHEN:</text>
  <text x="972" y="537" font-size="9" fill="#77777F">· legal threat</text>
  <text x="972" y="550" font-size="9" fill="#77777F">· refund &gt; $100</text>
  <text x="972" y="563" font-size="9" fill="#77777F">· confidence &lt; 0.70</text>
  <text x="972" y="576" font-size="9" fill="#77777F">· retries exhausted</text>

  <!-- ===== Logging strip ===== -->
  <rect x="40" y="616" width="1050" height="66" rx="6" fill="#F2F2F5" stroke="#8A8A94" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="565" y="643" font-size="13" font-weight="600" fill="#3C3C46" text-anchor="middle">FULL EXCHANGE LOG — every prompt, every draft, every verdict, every attempt</text>
  <text x="565" y="662" font-size="10.5" fill="#63636E" text-anchor="middle">logs/run_&lt;timestamp&gt;.jsonl · one JSON object per event · the audit trail that replaces line-by-line supervisor review</text>
  <text x="565" y="678" font-size="10" font-style="italic" fill="#8A8A94" text-anchor="middle">Nataki</text>

  <path d="M 323 198 L 323 610" fill="none" stroke="#B8B8C2" stroke-width="1.1" stroke-dasharray="3 5" marker-end="url(#arrowGray)"/>
  <path d="M 300 580 L 300 610" fill="none" stroke="#B8B8C2" stroke-width="1.1" stroke-dasharray="3 5" marker-end="url(#arrowGray)"/>
  <path d="M 820 580 L 820 610" fill="none" stroke="#B8B8C2" stroke-width="1.1" stroke-dasharray="3 5" marker-end="url(#arrowGray)"/>

  <!-- Legend -->
  <rect x="40" y="330" width="180" height="124" rx="5" fill="#FFFFFF" stroke="#C8C8D0" stroke-width="1.2"/>
  <text x="52" y="350" font-size="10" font-weight="700" fill="#3C3C46">LEGEND</text>
  <rect x="52" y="360" width="16" height="12" rx="2" fill="#E8EEF7" stroke="#2C4B7C" stroke-width="1.3"/>
  <text x="76" y="370" font-size="10" fill="#4A4A55">LLM agent</text>
  <rect x="52" y="380" width="16" height="12" rx="2" fill="#EDF3EC" stroke="#3D6B45" stroke-width="1.3"/>
  <text x="76" y="390" font-size="10" fill="#4A4A55">Deterministic tool</text>
  <path d="M 52 406 L 68 400 L 84 406 L 68 412 Z" fill="#FBF0D9" stroke="#9A6B1E" stroke-width="1.3"/>
  <text x="92" y="410" font-size="10" fill="#4A4A55">Decision point</text>
  <rect x="52" y="420" width="16" height="12" rx="2" fill="#F7E9E9" stroke="#8C3A3A" stroke-width="1.6"/>
  <text x="76" y="430" font-size="10" fill="#4A4A55">Human checkpoint</text>
  <text x="52" y="447" font-size="9.5" font-style="italic" fill="#8A8A94">italics = owner</text>
</svg>
